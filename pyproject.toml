[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-rubric-staleness-audit"
version = "0.1.0"
description = "Leakage-safe, replay-first dynamic rubric staleness audit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=2.33.0,<3", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
analysis = ["huggingface-hub>=0.34", "matplotlib>=3.8"]

[project.scripts]
dynamic-rubric = "dynamic_rubric.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
