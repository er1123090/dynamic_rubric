# Medicine EvoRubrics (RaR, not the original-ZIP HealthBench recipe).
# Edit launch.run_id, launch.smoke_run_id, optimizer GPU, and judge URL for a new run.
# Set launch.tuning_mode: custom to change Evo LoRA, LR, KL, temperature,
# or reward weights, batch/epoch/step counts. Evo updates use one GPU.
schema_version: 1
experiment: phase1_evaluator_update_value
domain: medicine
method: evorubrics
seed: 11
data:
  train_prompt_count: 1500
  fixed_train_probe:
    count: 100
    sample_seed: 11
    source: train
    remains_in_training: true
    extra_responses_used_for_gradient: false
    manifest: outputs/{domain}/shared/seed-11/manifests/fixed_train_probe.json
  in_domain_policy_eval:
    count: 300
    policy_only: true
    path: data/rar/medicine/eval300/final.jsonl
  external_policy_eval:
    policy_only: true
    name: HealthBench
    path: data/external/healthbench/prompts.jsonl
  train_path: data/rar/medicine/eval300/train.jsonl
models:
  policy:
    model: Qwen/Qwen3-4B-Instruct-2507
    revision: cdbee75f17c01a7cc42f958dc650907174af0554
    thinking: false
    backend: local_optimizer
    local_snapshot: models/Qwen3-4B-Instruct-2507
  shared_backbone:
    model: Qwen/Qwen3-4B-Instruct-2507
    revision: cdbee75f17c01a7cc42f958dc650907174af0554
    thinking: false
    backend: shared_local_backbone
  judge:
    local_snapshot: models/gpt-oss-120b
    model: openai/gpt-oss-120b
    revision: b5c939de8f754692c1647ca79fbf85e8c1e70f8a
    thinking: false
    backend: remote_vllm
    base_url_env: PHASE1_GPT_OSS_BASE_URL
# paper keeps reproduction defaults; custom permits the validated training knobs below.
training:
  algorithm: grpo
  epochs: 3
  global_prompt_batch: 96
  expected_global_steps: 48
  checkpoint_interval_steps: 1
  checkpoint_retention:
    latest_full_resume_state: true
    older_parameter_snapshots: true
    older_optimizer_state: false
  audit_checkpoints:
    - 0
    - 3
    - 6
    - 9
    - 13
    - 16
    - 24
    - 32
    - 40
    - 48
  reuse_anchors:
    - 0
    - 9
    - 16
    - 32
    - 48
  probe_responses_used_for_gradient: false
  per_step_logging:
    - cumulative_prompt_exposures
    - cumulative_completions
    - cumulative_response_tokens
    - adjacent_policy_kl
    - cumulative_policy_kl_from_pi0
    - response_length
infrastructure:
  code_host: ''  # Optional metadata: set your training host label.
  optimizer:
    host: ''
    gpus:
      - 1
  services:
    gpt_oss_120b:
      host: ''
      instances:
        - host: ''
          gpus: [0, 1]
          tensor_parallel_size: 2
          vllm_bin: .venvs/judge/bin/vllm
          python: .venvs/judge/bin/python
          bind_host: 127.0.0.1
          port: 28011
          gpu_memory_utilization: 0.48
          max_model_len: 32768
          max_num_seqs: 16
          max_num_batched_tokens: 2048
          dtype: auto
      tensor_parallel_size: 2
      base_url_env: PHASE1_GPT_OSS_BASE_URLS
    qwen3_32b:
      hosts:
        - ''
      instances:
        - host: ''
          gpus: [0, 1]
          tensor_parallel_size: 2
          vllm_bin: .venvs/judge/bin/vllm
          python: .venvs/judge/bin/python
          bind_host: 127.0.0.1
          port: 28014
          gpu_memory_utilization: 0.46
          max_model_len: 32768
          max_num_seqs: 16
          max_num_batched_tokens: 2048
          dtype: bfloat16
      base_url_env: PHASE1_QWEN32B_BASE_URLS
  pi0_control:
    host: ''
    gpus:
      - 1
    tensor_parallel_size: 1
    vllm_bin: .venvs/judge/bin/vllm
    runtime_python: .venvs/judge/bin/python
    gpu_memory_utilization: 0.45
    max_model_len: 7680
    max_num_seqs: 64
    max_num_batched_tokens: 16384
    upstream_port: 28101
    proxy_port: 28102
    concurrency: 16
    progress_every: 25
    free_memory_threshold_mib: 1024
    mode: precompute_before_optimizer
    immutable_cache: true
output:
  root: outputs
  layout: '{domain}/{method}/seed-{seed}/{run_id}'
tracking:
  project: phase1_dynamic_evaluator_updates
  legacy_static_project: dynamic_rubric_static_grpo
  group: medicine_evorubrics_phase1
# Runtime knobs: edit these values for the next run; no servers are started here.
launch:
  entry_python: .venvs/evorubrics/bin/python
  run_id: phase1-evo-medicine-run001
  tuning_mode: paper
  smoke_run_id: phase1-evo-medicine-smoke001
  environment:
    EVORUBRICS_JUDGE_URL: http://127.0.0.1:28011/v1
evorubrics:
  policy_adapter: theta
  rubric_generator_adapter: psi
  policy_responses_m: 4
  rubric_sets_n: 4
  pool_b_count: 16
  dataset_mode: open_rubrics
  training_flow: unified
  # Editable in custom mode; paper mode requires reproduction defaults.
  lora_rank: 32
  lora_alpha: 64
  policy_learning_rate: 2.0e-05
  rubric_generator_learning_rate: 5.0e-06
  kl_loss_coefficient: 0.0001
  generation_temperature: 0.7
  reward_weights:
    similarity: 0.25
    discrimination: 0.25
    diversity: 0.25
    reflect: 0.25
  reflect_use_golden_rubrics: true
  save_policy_and_generator: true
  fixed_rubric_generation_seeds: true
  rubric_generation_seeds:
    - 11001
    - 11002
    - 11003
    - 11004
  fixed_anchor_is_ground_truth: false
  original_method_objective: true
analysis:
  primary_dataset: fixed_train_probe
  same_response_pool_required: true
  same_judge_within_method: true
  heldout_used_for_update_timing: false
  compare_cross_method_absolute_rewards: false
  compare_cross_method_absolute_zar: false
  use_response_level_ground_truth: false
  use_initial_rubric_as_ground_truth: false
  enable_bon: false
  pool_a_b_disjoint: true
  reuse_anchors:
    - 0
    - 9
    - 16
    - 32
    - 48
  epsilon_z: 0.01
  epsilon_t: 0.01
  practical_margin_delta_d: 0.02
  pre_update_state_fields:
    - global_step
    - evaluator_age_steps
    - evaluator_age_checkpoints
    - cumulative_prompts_since_evaluator
    - cumulative_completions_since_evaluator
    - cumulative_response_tokens_since_evaluator
    - policy_kl_current_vs_evaluator
    - cumulative_policy_kl_from_pi0
    - response_length_shift
    - stale_zar
    - stale_pairwise_tie_rate
    - stale_pairwise_separation_rate
    - stale_effective_criterion_ratio
    - stale_saturation_ratio
    - stale_reward_std
    - stale_top_median_margin
smoke:
  prompt_count: 2
  stale_checkpoint: 0
  fresh_checkpoint: 3
