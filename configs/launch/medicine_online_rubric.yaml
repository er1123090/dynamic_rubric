# 설정 표시: 값의 삭제 가능 여부가 아니라 사용자가 확인/수정할 우선순위입니다.
# [REQUIRED] 실행 전 확인·준비 필수. 기본값이 내 환경과 맞으면 그대로 사용합니다.
# [OPTIONAL] 선택적 튜닝/기록. 기본값 사용 가능하며, 키·블록 삭제를 뜻하지 않습니다.
# [FIXED] 실험 계약상 유지할 값입니다. 별도 표시 없는 하위 값은 상위 표시를 따릅니다.
# 추론 서버/Online 사전 생성 항목은 해당 단계를 직접 실행할 때 확인합니다.
# Medicine OnlineRubrics. Common sections match the Static and Evo recipes.
# Edit launch.run_id for a new run. Set launch.tuning_mode: custom to change
# the training values below. Hardware and paths are configurable in both modes.
schema_version: 1  # [FIXED]
experiment: phase1_evaluator_update_value  # [FIXED]
domain: medicine  # [FIXED]
method: online_rubrics  # [FIXED]
# 예: seed를 23으로 바꾸면 probe seed/manifest와 pi0 cache도 seed-23으로 분리합니다.
seed: 11  # [OPTIONAL]
data:  # [REQUIRED] 실제 데이터 경로 확인; 외부 평가 항목은 아래 별도 표시
  # 예: 1200개 JSONL이면 1200으로 설정하며 실제 train 행 수와 정확히 일치해야 합니다.
  train_prompt_count: 1500  # [REQUIRED]
  fixed_train_probe:  # [OPTIONAL] 기본 probe 설정 사용; seed/data 변경 시 연동 확인
    count: 100  # [FIXED] 100개 유지
    # 위 seed 변경 예시에서는 이 값도 23으로 맞춥니다.
    sample_seed: 11  # [OPTIONAL] seed 변경 시 함께 변경
    source: train
    remains_in_training: true
    extra_responses_used_for_gradient: false
    # 예: seed 23이면 outputs/{domain}/shared/seed-23/manifests/fixed_train_probe.json
    manifest: outputs/{domain}/shared/seed-11/manifests/fixed_train_probe.json  # [OPTIONAL] seed 변경 시 함께 변경
  in_domain_policy_eval:  # [REQUIRED] heldout 데이터 준비
    count: 300  # [REQUIRED]
    policy_only: true
    path: data/rar/medicine/eval300/final.jsonl  # [REQUIRED]
  external_policy_eval:  # [OPTIONAL] 별도 외부 평가용; 공통 검증에 필요하므로 블록 유지
    policy_only: true
    name: HealthBench
    path: data/external/healthbench/prompts.jsonl
  # 예: /path/to/train.jsonl; train_prompt_count와 같은 데이터여야 합니다.
  train_path: data/rar/medicine/eval300/train.jsonl  # [REQUIRED]
models:  # [FIXED] 모델 ID/revision 유지; local_snapshot 경로는 별도 REQUIRED
  policy:
    model: Qwen/Qwen3-4B-Instruct-2507
    revision: cdbee75f17c01a7cc42f958dc650907174af0554
    thinking: false
    backend: local_optimizer
    # 예: /path/to/Qwen3-4B-Instruct-2507
    local_snapshot: models/Qwen3-4B-Instruct-2507  # [REQUIRED] 학습 머신의 모델 경로
  extractor:
    # 예: /path/to/gpt-oss-120b
    local_snapshot: models/gpt-oss-120b  # [REQUIRED] 해당 추론 서버를 직접 시작할 때의 모델 경로
    model: openai/gpt-oss-120b
    revision: main
    thinking: false
    backend: remote_vllm
    base_url_env: PHASE1_GPT_OSS_BASE_URL
    max_output_tokens: 8192
  deduplicator:
    model: openai/gpt-oss-120b
    revision: main
    thinking: false
    backend: remote_vllm
    base_url_env: PHASE1_GPT_OSS_BASE_URL
    max_output_tokens: 8192
  judge:
    # 예: /path/to/Qwen3-32B
    local_snapshot: models/Qwen3-32B  # [REQUIRED] 해당 추론 서버를 직접 시작할 때의 모델 경로
    model: Qwen/Qwen3-32B
    revision: 9216db5781bf21249d130ec9da846c4624c16137
    thinking: false
    backend: remote_vllm
    base_url_env: PHASE1_QWEN32B_BASE_URL
    max_output_tokens: 4096
# 학습값을 바꾸려면 launch.tuning_mode을 custom으로 설정합니다(paper는 재현값 고정).
training:  # [OPTIONAL] 기본 학습값 사용 가능; FIXED 항목 제외
  algorithm: grpo  # [FIXED]
  # 예: 2 epochs. 데이터/batch로 계산되는 step이 expected_global_steps보다 먼저 끝날 수 있습니다.
  epochs: 3  # [OPTIONAL]
  # 예: 64; ppo_mini_batch_size는 이 값의 약수로 둡니다.
  global_prompt_batch: 96  # [OPTIONAL]
  # 예: 32; 줄이면 아래 audit/reuse/analysis anchor에서 32 초과 값을 제거합니다.
  expected_global_steps: 48  # [OPTIONAL]
  # 유지: 매 step 저장은 고정이며 1을 유지합니다.
  checkpoint_interval_steps: 1  # [FIXED]
  # 유지: 최신 step만 optimizer 포함 재개 상태, 이전 step은 parameter snapshot만 보존합니다.
  checkpoint_retention:  # [FIXED]
    latest_full_resume_state: true
    older_parameter_snapshots: true
    older_optimizer_state: false
  # 아래 값은 custom 모드에서만 변경합니다. 예: global batch 64이면 mini batch 32.
  ppo_mini_batch_size: 96  # [OPTIONAL]
  # 예: prompt 3072 / response 2048; 데이터 길이와 VRAM을 함께 확인합니다.
  max_prompt_length: 4096  # [OPTIONAL]
  max_response_length: 3584  # [OPTIONAL]
  # 예: 학습 GPU [2,3]에서 TP 2; GPU 개수를 정확히 나누어야 합니다.
  rollout_tensor_parallel_size: 1  # [OPTIONAL]
  # 예: 1.0e-6
  learning_rate: 5.0e-6  # [OPTIONAL]
  warmup_ratio: 0.1  # [OPTIONAL]
  # 예: 0.02
  kl_coefficient: 0.01  # [OPTIONAL]
  # 예: temperature 0.8 / top-p 0.9
  rollout_temperature: 1.0  # [OPTIONAL]
  rollout_top_p: 0.95  # [OPTIONAL]
  audit_checkpoints:  # [OPTIONAL] 종료 step 변경 시 범위도 맞춤
    - 0
    - 3
    - 6
    - 9
    - 13
    - 16
    - 24
    - 32
    - 40
    - 48
  reuse_anchors:  # [OPTIONAL] 종료 step 변경 시 범위도 맞춤
    - 0
    - 9
    - 16
    - 32
    - 48
  probe_responses_used_for_gradient: false  # [FIXED]
  per_step_logging:  # [FIXED]
    - cumulative_prompt_exposures
    - cumulative_completions
    - cumulative_response_tokens
    - adjacent_policy_kl
    - cumulative_policy_kl_from_pi0
    - response_length
infrastructure:
  # 선택적 기록값 예: trainer; 실제 배치/SSH에는 사용되지 않으므로 빈 값도 허용됩니다.
  code_host: ''  # [OPTIONAL] 기록용; 빈 값 허용
  optimizer:
    host: ''  # [OPTIONAL] 기록용; 빈 값 허용
    # 예: [2] 또는 [2, 3]; 현재 학습 runtime에서 보이는 GPU 번호입니다.
    gpus:  # [REQUIRED] 사용할 학습 GPU
      - 1
  services:
    gpt_oss_120b:
      host: ''  # [OPTIONAL] 기록용; 빈 값 허용
      instances:
        - host: ''  # [OPTIONAL] 기록용; 빈 값 허용
          # 예: inference GPU [0,1]에서 TP 2; TP는 GPU 목록 길이와 같아야 합니다.
          gpus: [0, 1]  # [REQUIRED] 해당 추론 서버 시작 시 확인
          tensor_parallel_size: 2  # [REQUIRED] 해당 추론 서버 시작 시 확인
          # 예: /path/to/judge-venv/bin/vllm 및 /path/to/judge-venv/bin/python
          vllm_bin: .venvs/judge/bin/vllm  # [REQUIRED] 해당 추론 서버 시작 시 확인
          python: .venvs/judge/bin/python  # [OPTIONAL] 이 방법의 raw vLLM 서비스에서는 미사용
          bind_host: 127.0.0.1  # [OPTIONAL]
          # 예: 로컬/터널 포트 18001을 쓰면 아래 GPT-OSS URL도 함께 바꿉니다.
          port: 28011  # [REQUIRED] 해당 추론 서버 시작 시 확인
          # 예: 0.45; Qwen과 GPU를 공유하면 두 서버 utilization 합과 runtime overhead를 함께 계산합니다.
          gpu_memory_utilization: 0.48  # [REQUIRED] 해당 추론 서버 시작 시 확인
          max_model_len: 32768  # [OPTIONAL]
          # 예: max_num_seqs 8 / max_num_batched_tokens 1024; 처리량보다 OOM 안정성을 우선할 때 낮춥니다.
          max_num_seqs: 16  # [OPTIONAL]; 예: 32 (VRAM 여유가 있을 때)
          max_num_batched_tokens: 2048  # [OPTIONAL]; 예: 4096 (처리 속도와 VRAM 함께 확인)
          dtype: auto  # [OPTIONAL]
      tensor_parallel_size: 2  # [FIXED] 공통 메타데이터; 실제 TP는 instances에서 설정
      base_url_env: PHASE1_GPT_OSS_BASE_URLS  # [FIXED]
    qwen3_32b:
      hosts:  # [OPTIONAL] 기록용; 빈 값 허용
        - ''
      instances:
        - host: ''  # [OPTIONAL] 기록용; 빈 값 허용
          # 예: inference GPU [0,1]에서 TP 2; GPT-OSS와 동시 실행 시 GPU/VRAM 중복을 피합니다.
          gpus: [0, 1]  # [REQUIRED] 해당 추론 서버 시작 시 확인
          tensor_parallel_size: 2  # [REQUIRED] 해당 추론 서버 시작 시 확인
          # 예: /path/to/judge-venv/bin/vllm 및 /path/to/judge-venv/bin/python
          vllm_bin: .venvs/judge/bin/vllm  # [REQUIRED] 해당 추론 서버 시작 시 확인
          python: .venvs/judge/bin/python  # [OPTIONAL] 이 방법의 raw vLLM 서비스에서는 미사용
          bind_host: 127.0.0.1  # [OPTIONAL]
          # 예: 로컬/터널 포트 18002를 쓰면 아래 Qwen URL도 함께 바꿉니다.
          port: 28014  # [REQUIRED] 해당 추론 서버 시작 시 확인
          gpu_memory_utilization: 0.46  # [REQUIRED] 해당 추론 서버 시작 시 확인
          max_model_len: 32768  # [OPTIONAL]
          # 예: max_num_seqs 8 / max_num_batched_tokens 1024
          max_num_seqs: 16  # [OPTIONAL]; 예: 32 (VRAM 여유가 있을 때)
          max_num_batched_tokens: 2048  # [OPTIONAL]; 예: 4096 (처리 속도와 VRAM 함께 확인)
          dtype: bfloat16  # [OPTIONAL]
      base_url_env: PHASE1_QWEN32B_BASE_URLS  # [FIXED]
  pi0_control:  # [REQUIRED] Online 제어 응답을 사전 생성할 때 확인
    host: ''  # [OPTIONAL] 기록용; 빈 값 허용
    # 예: 유휴 GPU [3]에서 TP 1; optimizer와 동시에 같은 GPU를 쓰지 않습니다.
    gpus:  # [REQUIRED] 사전 생성 시 확인
      - 1
    tensor_parallel_size: 1  # [REQUIRED] 사전 생성 시 확인
    vllm_bin: .venvs/judge/bin/vllm  # [REQUIRED] 사전 생성 시 확인
    runtime_python: .venvs/judge/bin/python  # [REQUIRED] 사전 생성 시 확인
    gpu_memory_utilization: 0.45  # [REQUIRED] 사전 생성 시 확인
    max_model_len: 7680  # [OPTIONAL]
    # 예: max_num_seqs 32 / max_num_batched_tokens 8192
    max_num_seqs: 64  # [OPTIONAL]
    max_num_batched_tokens: 16384  # [OPTIONAL]
    # 예: upstream 18101 / proxy 18102; 사용 중이지 않은 포트를 선택합니다.
    upstream_port: 28101  # [REQUIRED] 사전 생성 시 확인
    proxy_port: 28102  # [REQUIRED] 사전 생성 시 확인
    # 예: 32; OOM/timeout이 나면 낮춥니다.
    concurrency: 16  # [OPTIONAL]
    progress_every: 25  # [OPTIONAL]
    free_memory_threshold_mib: 1024  # [OPTIONAL]
    mode: precompute_before_optimizer  # [FIXED]
    immutable_cache: true  # [FIXED]
output:
  # 예: /path/to/experiment-outputs
  root: outputs  # [REQUIRED] 쓰기 권한·디스크 여유 확인; 기본 위치 사용 가능
  layout: '{domain}/{method}/seed-{seed}/{run_id}'  # [FIXED]
tracking:  # [FIXED] Phase-1 project 유지; group은 아래 별도 표시
  project: phase1_dynamic_evaluator_updates
  legacy_static_project: dynamic_rubric_static_grpo
  group: medicine_online_rubrics_phase1  # [OPTIONAL] 실험 그룹 이름; 기본값 사용 가능
# Runtime knobs: edit these values for the next run; no servers are started here.
launch:
  # 예: /path/to/verl-venv/bin/python
  entry_python: .venvs/verl/bin/python  # [REQUIRED] 실행 가능한 학습 runtime Python
  # 예: phase1-online-rubrics-medicine-full-exp02; 새 실험마다 고유하게 지정합니다.
  run_id: phase1-online-rubrics-medicine-full-run001  # [REQUIRED] 신규 실험은 고유 ID, 재개는 기존 ID
  # 예: custom (학습값 변경 시); paper는 논문 재현 기본값을 검사합니다.
  tuning_mode: paper  # [OPTIONAL] 학습값을 바꿀 때 custom 사용
  environment:  # [OPTIONAL] 성능/실행 옵션은 기본값 사용 가능; REQUIRED 항목은 개별 확인
    # 예: /path/to/verl-venv/bin/python; 위 launch.entry_python과 같은 runtime을 지정합니다.
    RUNTIME_PYTHON: .venvs/verl/bin/python  # [REQUIRED]; 예: /path/to/verl-venv/bin/python (entry_python과 함께 맞춤)
    # 예: SSH 터널을 쓴 두 replica면 http://127.0.0.1:18001,http://127.0.0.1:18003
    PHASE1_GPT_OSS_BASE_URLS: http://127.0.0.1:28011  # [REQUIRED]
    # URL 개수는 service instances 개수와 맞춥니다. 예: http://127.0.0.1:18002
    PHASE1_QWEN32B_BASE_URLS: http://127.0.0.1:28014  # [REQUIRED]
    PHASE1_QWEN32B_EXPECTED_COUNT: '1'  # [OPTIONAL]
    # seed 23 예시에서는 별도 seed-23 cache를 생성해 지정합니다.
    ONLINE_CONTROL_CACHE_DIR: outputs/medicine/shared/seed-11/pi0_control_cache  # [REQUIRED] 학습 전에 생성된 pi0 cache/manifest 필요
    # 예: extractor 24 / grader 32; 서버 처리량과 timeout에 맞춥니다.
    ONLINE_EXTRACTOR_CONCURRENCY: '48'  # [OPTIONAL]
    ONLINE_GRADER_CONCURRENCY: '64'  # [OPTIONAL]
    ONLINE_LOGPROB_PREFETCH: 'true'  # [OPTIONAL]
    PYTHONUNBUFFERED: '1'  # [OPTIONAL]
online_rubrics:  # [FIXED] Online 알고리즘/응답 수 계약 유지
  # 유지: reward/pi0 계약은 responses 16, elicitation pairs 8 고정이며 custom에서도 바꾸지 않습니다.
  policy_responses_per_prompt: 16
  elicitation_pairs_per_prompt: 8
  control_policy: pi_0_fixed
  control_cache: precomputed_immutable
  augmentation: step_local
  accumulate_previous_criteria: false
  fresh_reward_used_for_training: true
  stale_shadow_only: true
  stale_lookup_key: prompt_id
  require_prompt_match: true
  pool_a_current_count: 8
  pool_a_pi0_count: 8
  pool_b_count: 16
analysis:  # [FIXED] 기본 검증/분석 계약 유지; reuse_anchors는 아래 별도 표시
  primary_dataset: fixed_train_probe
  same_response_pool_required: true
  same_judge_within_method: true
  heldout_used_for_update_timing: false
  compare_cross_method_absolute_rewards: false
  compare_cross_method_absolute_zar: false
  use_response_level_ground_truth: false
  use_initial_rubric_as_ground_truth: false
  enable_bon: false
  pool_a_b_disjoint: true
  # training.reuse_anchors를 줄였다면 이 목록도 같은 step 범위로 맞춥니다.
  # 예: 종료 step이 32이면 [0, 9, 16, 32]; training.reuse_anchors와 함께 맞춥니다.
  reuse_anchors:  # [OPTIONAL] training.reuse_anchors와 종료 step 연동
    - 0
    - 9
    - 16
    - 32
    - 48
  epsilon_z: 0.01
  epsilon_t: 0.01
  practical_margin_delta_d: 0.02
  pre_update_state_fields:
    - global_step
    - evaluator_age_steps
    - evaluator_age_checkpoints
    - cumulative_prompts_since_evaluator
    - cumulative_completions_since_evaluator
    - cumulative_response_tokens_since_evaluator
    - policy_kl_current_vs_evaluator
    - cumulative_policy_kl_from_pi0
    - response_length_shift
    - stale_zar
    - stale_pairwise_tie_rate
    - stale_pairwise_separation_rate
    - stale_effective_criterion_ratio
    - stale_saturation_ratio
    - stale_reward_std
    - stale_top_median_margin
smoke:  # [FIXED] 기본 사전 검증 설정 유지
  prompt_count: 2
  stale_checkpoint: 0
  fresh_checkpoint: 3
