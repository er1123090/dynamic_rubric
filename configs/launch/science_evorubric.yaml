# 설정 표시: 값의 삭제 가능 여부가 아니라 사용자가 확인/수정할 우선순위입니다.
# [REQUIRED] 실행 전 확인·준비 필수. 기본값이 내 환경과 맞으면 그대로 사용합니다.
# [OPTIONAL] 선택적 튜닝/기록. 기본값 사용 가능하며, 키·블록 삭제를 뜻하지 않습니다.
# [FIXED] 실험 계약상 유지할 값입니다. 별도 표시 없는 하위 값은 상위 표시를 따릅니다.
# 추론 서버/Online 사전 생성 항목은 해당 단계를 직접 실행할 때 확인합니다.
# Science EvoRubrics (RaR, not the original-ZIP HealthBench recipe).
# Edit launch.run_id, launch.smoke_run_id, optimizer GPU, and judge URL for a new run.
# Set launch.tuning_mode: custom to change Evo LoRA, LR, KL, temperature,
# or reward weights, batch/epoch/step counts. Evo updates use one GPU.
schema_version: 1  # [FIXED]
experiment: phase1_evaluator_update_value  # [FIXED]
domain: science  # [FIXED]
method: evorubrics  # [FIXED]
# 예: seed를 23으로 바꾸면 probe seed와 manifest 경로도 seed-23으로 분리합니다.
seed: 11  # [OPTIONAL]
data:  # [REQUIRED] 실제 데이터 경로 확인; 외부 평가 항목은 아래 별도 표시
  # 예: 1200개 JSONL이면 1200으로 설정하며 실제 train 행 수와 정확히 일치해야 합니다.
  train_prompt_count: 1500  # [REQUIRED]
  fixed_train_probe:  # [OPTIONAL] 기본 probe 설정 사용; seed/data 변경 시 연동 확인
    count: 100  # [FIXED] 100개 유지
    # 위 seed 변경 예시에서는 이 값도 23으로 맞춥니다.
    sample_seed: 11  # [OPTIONAL] seed 변경 시 함께 변경
    source: train
    remains_in_training: true
    extra_responses_used_for_gradient: false
    # 예: seed 23이면 outputs/{domain}/shared/seed-23/manifests/fixed_train_probe.json
    manifest: outputs/{domain}/shared/seed-11/manifests/fixed_train_probe.json  # [OPTIONAL] seed 변경 시 함께 변경
  # 예: 별도 평가 파일은 /path/to/in_domain_final.jsonl처럼 지정할 수 있습니다.
  in_domain_policy_eval:  # [REQUIRED] heldout 데이터 준비
    count: 300  # [REQUIRED]
    policy_only: true
    path: data/rar/science/public/final.jsonl  # [REQUIRED]
  # 예: 외부 평가는 /path/to/external_eval.jsonl을 준비하고 아래 path를 바꿉니다.
  external_policy_eval:  # [OPTIONAL] 별도 외부 평가용; 공통 검증에 필요하므로 블록 유지
    policy_only: true
    name: GPQA-Diamond
    path: data/external/gpqa_diamond/prompts.jsonl
  # 예: /path/to/train.jsonl; train_prompt_count와 같은 데이터여야 합니다.
  train_path: data/rar/science/public/train.jsonl  # [REQUIRED]
models:  # [FIXED] 모델 ID/revision 유지; local_snapshot 경로는 별도 REQUIRED
  policy:
    model: Qwen/Qwen3-4B-Instruct-2507
    revision: cdbee75f17c01a7cc42f958dc650907174af0554
    thinking: false
    backend: local_optimizer
    # 예: /path/to/Qwen3-4B-Instruct-2507 (policy/shared backbone 공용)
    local_snapshot: models/Qwen3-4B-Instruct-2507  # [REQUIRED] 학습 머신의 모델 경로
  shared_backbone:
    model: Qwen/Qwen3-4B-Instruct-2507
    revision: cdbee75f17c01a7cc42f958dc650907174af0554
    thinking: false
    backend: shared_local_backbone
  judge:
    # 예: /path/to/gpt-oss-120b
    local_snapshot: models/gpt-oss-120b  # [REQUIRED] 해당 추론 서버를 직접 시작할 때의 모델 경로
    model: openai/gpt-oss-120b
    revision: b5c939de8f754692c1647ca79fbf85e8c1e70f8a
    thinking: false
    backend: remote_vllm
    base_url_env: PHASE1_GPT_OSS_BASE_URL
# 학습값을 바꾸려면 launch.tuning_mode을 custom으로 설정합니다(paper는 재현값 고정).
training:  # [OPTIONAL] 기본 학습값 사용 가능; FIXED 항목 제외
  algorithm: grpo  # [FIXED]
  # 예: 2 epochs. 데이터/batch로 계산되는 step이 expected_global_steps보다 먼저 끝날 수 있습니다.
  epochs: 3  # [OPTIONAL]
  # 예: 64
  global_prompt_batch: 96  # [OPTIONAL]
  # 예: 32; 줄이면 아래 audit/reuse/analysis anchor에서 32 초과 값을 제거합니다.
  expected_global_steps: 48  # [OPTIONAL]
  # 유지: 매 step policy/generator LoRA 저장은 고정이며 1을 유지합니다.
  checkpoint_interval_steps: 1  # [FIXED]
  # 유지: retention 계약 기록값이며 canonical Evo runner는 중단된 본 학습 --resume을 지원하지 않습니다.
  checkpoint_retention:  # [FIXED]
    latest_full_resume_state: true
    older_parameter_snapshots: true
    older_optimizer_state: false
  # step 32 예시라면 40, 48을 제거하고 마지막 값을 32 이하로 맞춥니다.
  audit_checkpoints:  # [OPTIONAL] 종료 step 변경 시 범위도 맞춤
    - 0
    - 3
    - 6
    - 9
    - 13
    - 16
    - 24
    - 32
    - 40
    - 48
  reuse_anchors:  # [OPTIONAL] 종료 step 변경 시 범위도 맞춤
    - 0
    - 9
    - 16
    - 32
    - 48
  probe_responses_used_for_gradient: false  # [FIXED]
  per_step_logging:  # [FIXED]
    - cumulative_prompt_exposures
    - cumulative_completions
    - cumulative_response_tokens
    - adjacent_policy_kl
    - cumulative_policy_kl_from_pi0
    - response_length
infrastructure:
  # 선택적 기록값 예: trainer; 실제 배치/SSH에는 사용되지 않으므로 빈 값도 허용됩니다.
  code_host: ''  # [OPTIONAL] 기록용; 빈 값 허용
  optimizer:
    host: ''  # [OPTIONAL] 기록용; 빈 값 허용
    # 예: [2]. Evo optimizer는 반드시 GPU 한 장만 지정합니다([2,3]은 지원하지 않음).
    gpus:  # [REQUIRED] Evo 학습 GPU 한 장
      - 1
  services:
    gpt_oss_120b:
      host: ''  # [OPTIONAL] 기록용; 빈 값 허용
      instances:
        - host: ''  # [OPTIONAL] 기록용; 빈 값 허용
          # 예: inference GPU [0,1]에서 TP 2; TP는 GPU 목록 길이와 같아야 합니다.
          gpus: [0, 1]  # [REQUIRED] 해당 추론 서버 시작 시 확인
          tensor_parallel_size: 2  # [REQUIRED] 해당 추론 서버 시작 시 확인
          # 예: /path/to/judge-venv/bin/vllm 및 /path/to/judge-venv/bin/python
          vllm_bin: .venvs/judge/bin/vllm  # [REQUIRED] 해당 추론 서버 시작 시 확인
          python: .venvs/judge/bin/python  # [OPTIONAL] 이 방법의 raw vLLM 서비스에서는 미사용
          bind_host: 127.0.0.1  # [OPTIONAL]
          # 예: 로컬/터널 포트 18001을 쓰면 EVORUBRICS_JUDGE_URL도 함께 바꿉니다.
          port: 28011  # [REQUIRED] 해당 추론 서버 시작 시 확인
          # 예: 0.85; 실제 VRAM에 맞춰 batching 값과 함께 조정합니다.
          gpu_memory_utilization: 0.48  # [REQUIRED] 해당 추론 서버 시작 시 확인
          max_model_len: 32768  # [OPTIONAL]
          # 예: max_num_seqs 8 / max_num_batched_tokens 1024; OOM이면 먼저 낮춥니다.
          max_num_seqs: 16  # [OPTIONAL]; 예: 32 (VRAM 여유가 있을 때)
          max_num_batched_tokens: 2048  # [OPTIONAL]; 예: 4096 (처리 속도와 VRAM 함께 확인)
          dtype: auto  # [OPTIONAL]
      tensor_parallel_size: 2  # [FIXED] 공통 메타데이터; 실제 TP는 instances에서 설정
      base_url_env: PHASE1_GPT_OSS_BASE_URLS  # [FIXED]
    # 아래 Qwen 서비스 블록은 공통 형식에서 상속되지만 canonical Evo 실행에서는 사용하지 않습니다.
    qwen3_32b:  # [OPTIONAL] Evo 실행에서는 미사용; 공통 스키마상 필수이므로 블록 유지
      hosts:
        - ''
      instances:
        - host: ''
          gpus: [0, 1]
          tensor_parallel_size: 2
          vllm_bin: .venvs/judge/bin/vllm
          python: .venvs/judge/bin/python
          bind_host: 127.0.0.1
          port: 28014
          gpu_memory_utilization: 0.46
          max_model_len: 32768
          max_num_seqs: 16
          max_num_batched_tokens: 2048
          dtype: bfloat16
      base_url_env: PHASE1_QWEN32B_BASE_URLS
  # 아래 pi0_control 블록도 Online 공통 형식용이며 canonical Evo 실행에서는 사용하지 않습니다.
  pi0_control:  # [OPTIONAL] Evo 실행에서는 미사용; 공통 스키마상 필수이므로 블록 유지
    host: ''
    gpus:
      - 1
    tensor_parallel_size: 1
    vllm_bin: .venvs/judge/bin/vllm
    runtime_python: .venvs/judge/bin/python
    gpu_memory_utilization: 0.45
    max_model_len: 7680
    max_num_seqs: 64
    max_num_batched_tokens: 16384
    upstream_port: 28101
    proxy_port: 28102
    concurrency: 16
    progress_every: 25
    free_memory_threshold_mib: 1024
    mode: precompute_before_optimizer
    immutable_cache: true
output:
  # 예: /path/to/outputs (매 step 두 LoRA를 저장할 충분한 디스크 필요)
  root: outputs  # [REQUIRED] 쓰기 권한·디스크 여유 확인; 기본 위치 사용 가능
  layout: '{domain}/{method}/seed-{seed}/{run_id}'  # [FIXED]
tracking:  # [FIXED] Phase-1 project 유지; group은 아래 별도 표시
  project: phase1_dynamic_evaluator_updates
  legacy_static_project: dynamic_rubric_static_grpo
  group: science_evorubrics_phase1  # [OPTIONAL] 실험 그룹 이름; 기본값 사용 가능
# Runtime knobs: edit these values for the next run; no servers are started here.
launch:
  # 예: /path/to/evorubrics-venv/bin/python
  entry_python: .venvs/evorubrics/bin/python  # [REQUIRED] 실행 가능한 학습 runtime Python
  # 예: phase1-evo-science-exp02; 새 실험마다 고유하게 지정합니다.
  run_id: phase1-evo-science-run001  # [REQUIRED] 신규 실험마다 고유 ID; 현재 Evo 본 학습은 resume 미지원
  # 예: custom (Evo/학습값 변경 시); paper는 논문 재현 기본값을 검사합니다.
  tuning_mode: paper  # [OPTIONAL] 학습값을 바꿀 때 custom 사용
  # 예: phase1-evo-science-smoke02; run_id와 별도로 새 실험마다 고유하게 지정합니다.
  smoke_run_id: phase1-evo-science-smoke001  # [REQUIRED] Evo 사전 검증용 고유 ID
  environment:  # [OPTIONAL] 성능/실행 옵션은 기본값 사용 가능; REQUIRED 항목은 개별 확인
    # 예: SSH 터널이면 http://127.0.0.1:18001/v1
    EVORUBRICS_JUDGE_URL: http://127.0.0.1:28011/v1  # [REQUIRED]
evorubrics:  # [OPTIONAL] custom 모드 튜닝; FIXED 항목 제외
  policy_adapter: theta  # [FIXED]
  rubric_generator_adapter: psi  # [FIXED]
  # 예: M=2, N=3이면 pool_b_count=6으로 바꾸고 seed 목록도 정확히 3개로 맞춥니다.
  policy_responses_m: 4  # [OPTIONAL] custom 모드에서만 변경
  rubric_sets_n: 4  # [OPTIONAL] custom 모드에서만 변경
  pool_b_count: 16  # [OPTIONAL] custom 모드에서만 변경
  dataset_mode: open_rubrics  # [FIXED]
  training_flow: unified  # [FIXED]
  # 아래 값은 custom 모드에서만 변경합니다. 예: LoRA rank 16 / alpha 32.
  lora_rank: 32  # [OPTIONAL] custom 모드에서만 변경
  lora_alpha: 64  # [OPTIONAL] custom 모드에서만 변경
  # 예: policy LR 1.0e-5
  policy_learning_rate: 2.0e-05  # [OPTIONAL] custom 모드에서만 변경
  # 예: rubric generator LR 3.0e-6
  rubric_generator_learning_rate: 5.0e-06  # [OPTIONAL] custom 모드에서만 변경
  # 예: 0.001
  kl_loss_coefficient: 0.0001  # [OPTIONAL] custom 모드에서만 변경
  # 예: 0.8
  generation_temperature: 0.7  # [OPTIONAL] custom 모드에서만 변경
  # 합은 1이어야 합니다. 예: similarity/discrimination/diversity/reflect = 0.4/0.3/0.2/0.1
  reward_weights:  # [OPTIONAL] custom 모드에서만 변경
    similarity: 0.25
    discrimination: 0.25
    diversity: 0.25
    reflect: 0.25
  reflect_use_golden_rubrics: true  # [FIXED]
  save_policy_and_generator: true  # [FIXED]
  fixed_rubric_generation_seeds: true  # [FIXED]
  # 예: N=3이면 [23001, 23002, 23003]; pool_b_count도 policy_responses_m × 3으로 변경합니다.
  rubric_generation_seeds:  # [OPTIONAL] custom 모드에서만 변경
    - 11001
    - 11002
    - 11003
    - 11004
  fixed_anchor_is_ground_truth: false  # [FIXED]
  original_method_objective: true  # [FIXED]
analysis:  # [FIXED] 기본 검증/분석 계약 유지; reuse_anchors는 아래 별도 표시
  primary_dataset: fixed_train_probe
  same_response_pool_required: true
  same_judge_within_method: true
  heldout_used_for_update_timing: false
  compare_cross_method_absolute_rewards: false
  compare_cross_method_absolute_zar: false
  use_response_level_ground_truth: false
  use_initial_rubric_as_ground_truth: false
  enable_bon: false
  pool_a_b_disjoint: true
  # training.reuse_anchors를 줄였다면 이 목록도 같은 step 범위로 맞춥니다.
  # 예: 종료 step이 32이면 [0, 9, 16, 32]; training.reuse_anchors와 함께 맞춥니다.
  reuse_anchors:  # [OPTIONAL] training.reuse_anchors와 종료 step 연동
    - 0
    - 9
    - 16
    - 32
    - 48
  epsilon_z: 0.01
  epsilon_t: 0.01
  practical_margin_delta_d: 0.02
  pre_update_state_fields:
    - global_step
    - evaluator_age_steps
    - evaluator_age_checkpoints
    - cumulative_prompts_since_evaluator
    - cumulative_completions_since_evaluator
    - cumulative_response_tokens_since_evaluator
    - policy_kl_current_vs_evaluator
    - cumulative_policy_kl_from_pi0
    - response_length_shift
    - stale_zar
    - stale_pairwise_tie_rate
    - stale_pairwise_separation_rate
    - stale_effective_criterion_ratio
    - stale_saturation_ratio
    - stale_reward_std
    - stale_top_median_margin
smoke:  # [FIXED] 기본 사전 검증 설정 유지
  prompt_count: 2
  stale_checkpoint: 0
  fresh_checkpoint: 3
